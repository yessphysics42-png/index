<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لقاء الأولياء - ابتدائية المنار القرآنية</title>
  
  <!-- خط تجولي العربي -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">

  <style>
    /* 🎨 المتغيرات الأساسية (الوضع النهاري) */
    :root {
      --primary-color: #0f766e;
      --primary-hover: #0d9488;
      --bg-color: #f0fdfa;
      --card-bg: rgba(255, 255, 255, 0.92);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #ccfbf1;
      --input-bg: #ffffff;
      --card-shadow: 0 10px 25px -5px rgba(15, 118, 110, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.01);
      --danger-color: #ef4444;
    }

    /* 🌙 المتغيرات الخاصة بالوضع الليلي */
    body.dark-mode {
      --bg-color: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.92);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: #334155;
      --input-bg: #1e293b;
      --card-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }

    body {
      background-color: var(--bg-color);
      /* خلفية متدرجة زاهية ورائعة للاستجابة */
      background-image: 
        radial-gradient(circle at 10% 20%, rgba(15, 118, 110, 0.12) 0%, transparent 20%),
        radial-gradient(circle at 90% 80%, rgba(13, 148, 136, 0.12) 0%, transparent 25%);
      background-attachment: fixed;
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
    }

    main {
      width: 100%;
      max-width: 600px;
      position: relative;
    }

    /* 🔘 زر التبديل بين الوضع الليلي والنهاري */
    .theme-toggle-btn {
      position: absolute;
      top: 0;
      left: 0;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: var(--card-shadow);
      z-index: 10;
    }

    .theme-toggle-btn:hover {
      transform: scale(1.03);
    }

    header {
      text-align: center;
      margin-bottom: 24px;
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      padding: 20px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
    }

    .logo-img {
      max-width: 120px;
      height: auto;
      margin-bottom: 12px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.4;
    }

    .form-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      padding: 18px;
      box-shadow: var(--card-shadow);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    .form-card label {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    textarea {
      width: 100%;
      height: 95px;
      padding: 12px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      font-size: 15px;
      resize: none;
      outline: none;
      background-color: var(--input-bg);
      color: var(--text-main);
    }

    textarea:focus {
      border-color: var(--primary-color);
    }

    .btn-submit {
      width: 100%;
      background-color: var(--primary-color);
      color: #ffffff;
      border: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s, transform 0.1s;
    }

    .btn-submit:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 12px;
    }

    .section-header h3 {
      font-size: 18px;
      color: var(--text-main);
    }

    .section-header small {
      color: var(--text-muted);
      font-size: 12px;
    }

    .questions-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .q-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      box-shadow: var(--card-shadow);
    }

    .q-text {
      font-size: 15px;
      line-height: 1.5;
      color: var(--text-main);
      word-break: break-word;
    }

    /* 🔒 زر الحذف مخفي افتراضياً عن الجمهور */
    .delete-btn {
      background: none;
      border: none;
      color: var(--danger-color);
      font-size: 12px;
      cursor: pointer;
      margin-top: 6px;
      padding: 0;
      font-weight: 500;
      display: none;
    }

    .delete-btn:hover {
      text-decoration: underline;
    }

    /* إظهار زر الحذف فقط عند استخدام رابط المنظم ?admin=true */
    body.is-admin .delete-btn {
      display: inline-block;
    }

    .like-btn {
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      color: var(--text-main);
      white-space: nowrap;
      font-weight: 700;
    }

    .like-btn:hover {
      background: rgba(15, 118, 110, 0.1);
    }
  </style>
</head>
<body>

  <main>
    <!-- زر تبديل الوضع الليلي/النهاري -->
    <button class="theme-toggle-btn" onclick="toggleTheme()">
      <span id="themeIcon">🌙</span> <span id="themeText">الوضع الليلي</span>
    </button>

    <header>
      <img src="logo.png" alt="شعار المؤسسة" class="logo-img" id="logo" onerror="this.style.display='none'">
      <span class="subtitle">الاثنين 26 أكتوبر 2026م</span>
      <h1 id="eventTitle">اللقاء السنوي لأولياء ابتدائية المنار القرآنية</h1>
    </header>

    <div class="form-card">
      <label for="questionInput">اكتب سؤالك بوضوح</label>
      <textarea id="questionInput" placeholder="اكتب سؤالك هنا..."></textarea>
      <button class="btn-submit" onclick="sendQuestion()">إرسال السؤال</button>
    </div>

    <div class="section-header">
      <h3>الأسئلة</h3>
      <small>مرتّبة حسب الإعجابات</small>
    </div>

    <div id="questionsContainer" class="questions-list">
      جاري تحميل الأسئلة...
    </div>
  </main>

  <!-- ربط Firebase وتفعيل البيانات الحية والإدارة -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      onSnapshot, 
      doc, 
      updateDoc, 
      deleteDoc,
      increment, 
      orderBy, 
      query, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // إعدادات مشروعك في Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyD6ZVsR7CXZIvjaSYC9OKGmxykHM-mM4So",
      authDomain: "nadwa-8efe3.firebaseapp.com",
      projectId: "nadwa-8efe3",
      storageBucket: "nadwa-8efe3.firebasestorage.app",
      messagingSenderId: "308417718764",
      appId: "1:308417718764:web:117367cad262d6da84f8c9",
      measurementId: "G-TPYEW9YG9Z"
    };

    // تهيئة التطبيق وقاعدة البيانات
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const questionsRef = collection(db, "questions");

    // 🌗 التحكم بالوضع الليلي والنهاري
    window.toggleTheme = function() {
      const isDark = document.body.classList.toggle('dark-mode');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      updateThemeUI(isDark);
    };

    function updateThemeUI(isDark) {
      document.getElementById('themeIcon').innerText = isDark ? '☀️' : '🌙';
      document.getElementById('themeText').innerText = isDark ? 'الوضع النهاري' : 'الوضع الليلي';
    }

    // استعادة وضع المستخدم المفضل عند فتح الصفحة
    if (localStorage.getItem('theme') === 'dark') {
      document.body.classList.add('dark-mode');
      updateThemeUI(true);
    }

    // 🔒 التحقق إذا كان المستعمل هو المنظم برمز ?admin=true
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('admin') === 'true') {
      document.body.classList.add('is-admin');
    }

    // 1. وظيفة إرسال سؤال جديد
    window.sendQuestion = async function() {
      const textInput = document.getElementById("questionInput");
      const text = textInput.value.trim();

      if (!text) {
        alert("يرجى كتابة السؤال أولاً");
        return;
      }

      await addDoc(questionsRef, {
        text: text,
        likes: 0,
        createdAt: serverTimestamp()
      });

      textInput.value = "";
    };

    // 2. وظيفة التفاعل والإعجاب بالسؤال
    window.likeQuestion = async function(id) {
      const qDoc = doc(db, "questions", id);
      await updateDoc(qDoc, {
        likes: increment(1)
      });
    };

    // 3. وظيفة حذف السؤال (خاصة بالمنظم)
    window.deleteQuestion = async function(id) {
      if (confirm("هل أنت متأكد من حذف هذا السؤال؟")) {
        const qDoc = doc(db, "questions", id);
        await deleteDoc(qDoc);
      }
    };

    // 4. التحديث التلقائي اللحظي للأسئلة
    const qQuery = query(questionsRef, orderBy("likes", "desc"));
    onSnapshot(qQuery, (snapshot) => {
      const container = document.getElementById("questionsContainer");
      container.innerHTML = "";

      if (snapshot.empty) {
        container.innerHTML = "<p style='text-align:center; color:var(--text-muted); padding: 20px;'>لا توجد أسئلة بعد. كن أول من يسأل!</p>";
        return;
      }

      snapshot.forEach((docSnap) => {
        const data = docSnap.data();
        const card = document.createElement("div");
        card.className = "q-card";
        card.innerHTML = `
          <div style="flex-grow: 1;">
            <div class="q-text">${escapeHtml(data.text)}</div>
            <button class="delete-btn" onclick="deleteQuestion('${docSnap.id}')">🗑️ حذف السؤال</button>
          </div>
          <button class="like-btn" onclick="likeQuestion('${docSnap.id}')">
            👍 <span>${data.likes || 0}</span>
          </button>
        `;
        container.appendChild(card);
      });
    });

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.innerText = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
